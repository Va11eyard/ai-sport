services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sport
      POSTGRES_PASSWORD: sport
      POSTGRES_DB: athlete_twin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sport -d athlete_twin"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://sport:sport@db:5432/athlete_twin?schema=public
      CORS_ORIGIN: http://localhost:3400
      PORT: "8080"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TERRA_API_KEY: ${TERRA_API_KEY:-}
      TERRA_WEBHOOK_SECRET: ${TERRA_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://sport:sport@db:5432/athlete_twin?schema=public
    command: sh -c "npx prisma migrate deploy && npx tsx seed.ts"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: